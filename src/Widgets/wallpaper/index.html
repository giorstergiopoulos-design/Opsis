<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
html,body{margin:0;padding:0;width:100vw;height:100vh;overflow:hidden;background:#05070d}
#waves{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.videoLayer{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;background:#000;opacity:0;transition:opacity 650ms ease-in-out}
.videoLayer.active{opacity:1}
.videoHidden{display:none!important}
#mediaImg,#mediaFrame{position:fixed;inset:0;width:100vw;height:100vh;display:none;border:0;background:#000;object-fit:cover}
#desk{position:fixed;inset:0;display:none;background-repeat:no-repeat;background-position:center}
#wxInfo{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);text-align:center;color:#fff;pointer-events:none;display:none;
  font-family:"Segoe UI Light","Segoe UI",system-ui,sans-serif;text-shadow:0 2px 22px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.45);white-space:nowrap;--s:1;opacity:0;transition:opacity .7s ease}
#wxTime{font-size:calc(var(--s)*13vh);font-weight:200;line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums}
#wxDate{font-size:calc(var(--s)*3.2vh);font-weight:300;letter-spacing:.05em;margin-top:calc(var(--s)*1.2vh);opacity:.95;text-transform:capitalize}
#wxTemp{font-size:calc(var(--s)*4.4vh);font-weight:300;margin-top:calc(var(--s)*1.8vh);min-height:1.25em;line-height:1.25}
#wxWind{font-size:calc(var(--s)*2.6vh);font-weight:300;letter-spacing:.04em;margin-top:calc(var(--s)*.4vh);opacity:.85;line-height:1.25}
#wxWind:empty{display:none}
#wxCity{font-size:calc(var(--s)*2.4vh);font-weight:300;letter-spacing:.12em;margin-top:calc(var(--s)*.6vh);opacity:.75;text-transform:uppercase;min-height:1.25em;line-height:1.25}
#pulse{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.14),transparent 65%);opacity:0;transition:opacity 120ms linear}
</style>
</head>
<body>
<canvas id="waves"></canvas>
<video id="videoA" class="videoLayer" muted playsinline></video>
<video id="videoB" class="videoLayer" muted playsinline></video>
<div id="desk"></div>
<img id="mediaImg" alt="">
<iframe id="mediaFrame" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<div id="wxInfo"><div id="wxTime"></div><div id="wxDate"></div><div id="wxTemp"></div><div id="wxWind"></div><div id="wxCity"></div></div>
<div id="pulse"></div>
<script src="weather.js"></script>
<script src="elements.js"></script>
<script>
const canvas = document.getElementById('waves');
const ctx = canvas.getContext('2d');
// Δύο εναλλασσόμενα <video> layers (αντί για ένα) — ζητήθηκε ρητά "smooth transition χωρίς
// κενή μαύρη/λευκή εικόνα" ανάμεσα σε βίντεο μιας playlist. Ένα μόνο <video> element αλλάζει
// .src ακαριαία (ένα frame μαύρο/κενό μέχρι να φορτώσει το επόμενο). Με δύο layers, το επόμενο
// βίντεο φορτώνει ΚΡΥΦΑ (opacity 0) στο ανενεργό layer, και μόλις είναι έτοιμο να παίξει,
// γίνεται CSS crossfade (opacity transition, βλ. .videoLayer στο <style>) ανάμεσα στα δύο.
const videoLayers = [document.getElementById('videoA'), document.getElementById('videoB')];
let activeLayerIdx = 0;
const activeVideo = () => videoLayers[activeLayerIdx];
const nextVideo = () => videoLayers[1 - activeLayerIdx];
const pulse = document.getElementById('pulse');

let cfg = { mode: 'Waves', waveStyle: 'Ribbons', background: '#05070d', wave: '#0b3d91', peak: '#00d2ff', glow: '#00e5ff', highlight: '#ffffff', speed: 1, glowIntensity: 1, lineThickness: 1, performanceMode: 'Balanced', audioEnabled: false, audioVolume: 0.8, audioBassGain: 0, audioMidGain: 0, audioTrebleGain: 0 };

// Πραγματικό DSP (όχι μόνο ανάλυση/visualizer) πάνω στον ΔΙΚΟ ΜΑΣ ήχο του wallpaper video, μέσω
// Web Audio API — ζητήθηκε ρητά ως εναλλακτική στο system-wide Equalizer APO (εκείνο αλλάζει τον
// ήχο ΟΛΩΝ των εφαρμογών, αυτό εδώ ΜΟΝΟ το βίντεο wallpaper, αλλά χωρίς κανένα εξωτερικό
// εργαλείο/signing — δουλεύει ήδη μέσα στο Chromium/WebView2 engine που ούτως ή άλλως τρέχει).
// Τα βίντεο ξεκινούν ΠΑΝΤΑ muted (εγγυημένο autoplay χωρίς user gesture, ίδιο κόλπο με πριν) και
// ξε-σιγαίνονται ΜΟΝΟ αν cfg.audioEnabled, ΑΦΟΥ πετύχει το play() — ώστε ένα ενδεχόμενο autoplay
// block να μην προκαλέσει ποτέ λάθος "video error" -> άσκοπο advanceVideo().
let audioCtx = null;
let audioChain = null; // { bass, mid, treble, gain, input }
const routedVideoAudio = new WeakSet();

function ensureAudioGraph() {
    if (audioChain) return;
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const bass = audioCtx.createBiquadFilter(); bass.type = 'lowshelf'; bass.frequency.value = 150;
        const mid = audioCtx.createBiquadFilter(); mid.type = 'peaking'; mid.frequency.value = 1000; mid.Q.value = 1;
        const treble = audioCtx.createBiquadFilter(); treble.type = 'highshelf'; treble.frequency.value = 6000;
        const gain = audioCtx.createGain();
        bass.connect(mid); mid.connect(treble); treble.connect(gain); gain.connect(audioCtx.destination);
        audioChain = { bass, mid, treble, gain, input: bass };
    } catch (e) { audioChain = null; }
}

function routeVideoAudio(videoEl) {
    ensureAudioGraph();
    if (!audioChain || routedVideoAudio.has(videoEl)) return;
    try {
        const src = audioCtx.createMediaElementSource(videoEl);
        src.connect(audioChain.input);
        routedVideoAudio.add(videoEl);
    } catch (e) { /* ήδη routed αλλού, ή περιορισμός browser — το wallpaper συνεχίζει κανονικά, απλά χωρίς ήχο */ }
}

let autoMuted = false;   // another application is playing sound: the wallpaper audio is faded out
window.opsisAutoMute = (m) => { autoMuted = !!m; applyAudioConfig(); };
function applyAudioConfig() {
    autoMuted = !!cfg.autoMuted;
    videoLayers.forEach(routeVideoAudio);
    if (audioChain) {
        audioChain.bass.gain.value = cfg.audioBassGain || 0;
        audioChain.mid.gain.value = cfg.audioMidGain || 0;
        audioChain.treble.gain.value = cfg.audioTrebleGain || 0;
        const target = autoMuted ? 0 : (cfg.audioVolume ?? 0.8);
        if (audioCtx) audioChain.gain.gain.setTargetAtTime(target, audioCtx.currentTime, 0.25); else audioChain.gain.gain.value = target;
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    }
    // Ξε-σίγαση ΜΟΝΟ σε βίντεο που παίζουν ήδη επιτυχώς (readyState>=2 -> έχει ξεπεράσει το
    // αρχικό muted-autoplay) — αποφεύγει το γνωστό Chromium autoplay-block σε μη-muted play().
    videoLayers.forEach(v => { if (!v.paused && v.readyState >= 2) v.muted = !cfg.audioEnabled || (autoMuted && !audioChain); });
}
let audioTimer = null;
let waveLoopHandle = null;
let lastFrameTime = 0;
let waveOffset = 0;
let particles = [];
// Πραγματικά audio-reactive κύματα (όχι μόνο ένα radial glow overlay) — ζητήθηκε ρητά κατά το
// πρότυπο του Lively Wallpaper/Wallpaper Engine. Ενημερώνεται στο refreshAudioPulse() και
// διαβάζεται ζωντανά μέσα στο drawWaves/drawAurora/drawParticles για να διογκώνει το πλάτος
// και να επιταχύνει προσωρινά την κίνηση στα μπάσα/δυνατά σημεία του ήχου.
let audioBoost = 1;

function bridge() { return window.chrome?.webview?.hostObjects?.wallpaper ?? null; }

function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // το Weather σκηνικό δουλεύει σε φυσικά pixels (ταυτοτικός μετασχηματισμός) — βλ. drawWeather
    if (window.WeatherWallpaper) WeatherWallpaper.resize(canvas.width, canvas.height, dpr);
}
window.addEventListener('resize', () => { resizeCanvas(); lastFrameTime = 0; });
resizeCanvas();

function perfProfile() {
    switch (cfg.performanceMode) {
        case 'High':       return { layers: 4, glow: true,  glowBlur: 30, targetFps: 60, shading: true  };
        case 'Low Power':  return { layers: 2, glow: false, glowBlur: 0,  targetFps: 15, shading: false };
        case 'Battery':    return { layers: 1, glow: false, glowBlur: 0,  targetFps: 2,  shading: false };
        default:            return { layers: 3, glow: true,  glowBlur: 16, targetFps: 30, shading: true  }; // Balanced
    }
}

function hexToRgb(hex) {
    const h = hex.replace('#', '');
    const bigint = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
    return { r: (bigint >> 16) & 255, g: (bigint >> 8) & 255, b: bigint & 255 };
}
function hexToRgba(hex, alpha) { const c = hexToRgb(hex); return `rgba(${c.r},${c.g},${c.b},${alpha})`; }
function mix(a, b, t) { return { r: a.r + (b.r - a.r) * t, g: a.g + (b.g - a.g) * t, b: a.b + (b.b - a.b) * t }; }
function rgbToStr(c, a) { return `rgba(${c.r | 0},${c.g | 0},${c.b | 0},${a})`; }

// Εμπνευσμένο από γυαλιστερές, "τσαλακωμένες" κορδέλες κεραμικής/μεταξιού με απαλές
// σκιές βάθους ανάμεσα στις πτυχές και μια λεπτή, θερμή→ψυχρή λάμψη στην αιχμή κάθε πτυχής
// — αντί για επίπεδο, μονόχρωμο γέμισμα.
function drawWaves(dtSeconds) {
    const profile = perfProfile();
    const w = window.innerWidth, h = window.innerHeight;

    waveOffset += dtSeconds * 0.12 * cfg.speed;

    const bg = hexToRgb(cfg.background);
    const waveRgb = hexToRgb(cfg.wave);

    ctx.clearRect(0, 0, w, h);
    // Απαλό κάθετο gradient φόντου (όχι επίπεδο χρώμα) για αίσθηση βάθους.
    const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
    bgGrad.addColorStop(0, rgbToStr(mix(bg, waveRgb, 0.06), 1));
    bgGrad.addColorStop(1, rgbToStr(bg, 1));
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, w, h);

    const step = Math.max(6, Math.floor(w / 260));
    const colors = [cfg.peak, cfg.glow, cfg.highlight, cfg.glow, cfg.peak];

    for (let layer = 0; layer < profile.layers; layer++) {
        const depth = layer / Math.max(1, profile.layers - 1 || 1);
        const baseline = h * (0.50 + layer * 0.115);
        const amplitude = h * (0.055 + layer * 0.02) * audioBoost;
        const phaseSpeed = (0.5 + layer * 0.32) * cfg.speed;
        const freq1 = 0.0020 + layer * 0.0005;
        const freq2 = 0.0037 - layer * 0.0003;
        const freq3 = 0.0009 + layer * 0.0002;

        const points = [];
        for (let x = 0; x <= w; x += step) {
            // Τρία αρμονικά κύματα αθροισμένα -> πιο οργανικό, "τσαλακωμένο" περίγραμμα
            // αντί για καθαρό ημίτονο.
            const y = baseline
                - amplitude * (0.52 * Math.sin(x * freq1 + waveOffset * phaseSpeed)
                             + 0.30 * Math.sin(x * freq2 - waveOffset * phaseSpeed * 1.3)
                             + 0.18 * Math.sin(x * freq3 + waveOffset * phaseSpeed * 0.6 + layer));
            points.push([x, y]);
        }

        // Σκιά βάθους: ένα σκουρόχρωμο, θολό αντίγραφο της πτυχής λίγο πιο κάτω —
        // προσομοιώνει τη σκιά που πέφτει η μία "κορδέλα" πάνω στην επόμενη.
        if (profile.shading && layer > 0) {
            ctx.save();
            ctx.filter = 'blur(6px)';
            ctx.beginPath();
            ctx.moveTo(0, h);
            for (const [x, y] of points) ctx.lineTo(x, y + 10);
            ctx.lineTo(w, h);
            ctx.closePath();
            ctx.fillStyle = rgbToStr(mix(bg, { r: 0, g: 0, b: 0 }, 0.4), 0.35);
            ctx.fill();
            ctx.restore();
        }

        // Κύριο γέμισμα της πτυχής με κάθετο gradient (φωτεινό πάνω -> σκούρο/διάφανο κάτω),
        // ώστε να θυμίζει γυαλιστερή, καμπυλωτή επιφάνεια αντί για επίπεδη μάσκα χρώματος.
        ctx.beginPath();
        ctx.moveTo(0, h);
        for (const [x, y] of points) ctx.lineTo(x, y);
        ctx.lineTo(w, h);
        ctx.closePath();

        const minY = Math.min(...points.map(p => p[1]));
        const fillGrad = ctx.createLinearGradient(0, minY, 0, h);
        const topColor = mix(waveRgb, { r: 255, g: 255, b: 255 }, 0.16 - depth * 0.05);
        fillGrad.addColorStop(0, rgbToStr(topColor, 0.42 - depth * 0.08));
        fillGrad.addColorStop(0.5, rgbToStr(waveRgb, 0.30 - depth * 0.07));
        fillGrad.addColorStop(1, rgbToStr(mix(waveRgb, bg, 0.5), 0.16 - depth * 0.05));
        ctx.fillStyle = fillGrad;
        ctx.fill();

        // Η φωτεινή, κινούμενη γραμμή πάνω στην αιχμή του κύματος — θερμό→ψυχρό shimmer
        // που ταξιδεύει κατά μήκος της πτυχής, όπως στα reference renders.
        ctx.beginPath();
        ctx.moveTo(points[0][0], points[0][1]);
        for (const [x, y] of points) ctx.lineTo(x, y);

        const grad = ctx.createLinearGradient(0, 0, w, 0);
        const shift = (waveOffset * 0.045 * (layer + 1)) % 1;
        for (let i = 0; i <= 8; i++) {
            const pos = ((i / 8) + shift) % 1;
            grad.addColorStop(pos, colors[i % colors.length]);
        }

        ctx.lineWidth = Math.max(1, (2.4 - layer * 0.35) * cfg.lineThickness * audioBoost);
        ctx.strokeStyle = grad;
        ctx.lineJoin = 'round';
        if (profile.glow) {
            ctx.shadowColor = cfg.glow;
            ctx.shadowBlur = profile.glowBlur * cfg.glowIntensity * audioBoost;
        } else {
            ctx.shadowBlur = 0;
        }
        ctx.stroke();

        // Δεύτερο, στενότερο πέρασμα εντελώς λευκό στο κέντρο της γραμμής — δίνει την
        // εντύπωση καυτού, γυάλινου highlight αντί για επίπεδη έγχρωμη γραμμή.
        ctx.shadowBlur = 0;
        ctx.lineWidth = Math.max(0.6, ctx.lineWidth * 0.35);
        ctx.strokeStyle = rgbToStr({ r: 255, g: 255, b: 255 }, 0.55);
        ctx.stroke();
        ctx.shadowBlur = 0;
    }
}

// Δεύτερη παραλλαγή μέσα στο Waves mode: κάθετες, "σαρώνουσες" κορδέλες φωτός (aurora
// borealis) αντί για οριζόντιες πτυχωτές κορυφογραμμές.
function drawAurora(dtSeconds) {
    const profile = perfProfile();
    const w = window.innerWidth, h = window.innerHeight;
    waveOffset += dtSeconds * 0.15 * cfg.speed;

    const bg = hexToRgb(cfg.background);
    ctx.clearRect(0, 0, w, h);
    const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
    bgGrad.addColorStop(0, rgbToStr(bg, 1));
    bgGrad.addColorStop(1, rgbToStr(mix(bg, { r: 0, g: 0, b: 0 }, 0.3), 1));
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, w, h);

    const bandColors = [cfg.wave, cfg.glow, cfg.peak, cfg.highlight];
    const bandCount = profile.layers + 1;
    for (let b = 0; b < bandCount; b++) {
        const baseX = (w / bandCount) * (b + 0.5) + Math.sin(waveOffset * 0.6 + b) * (w * 0.08);
        const color = hexToRgb(bandColors[b % bandColors.length]);
        const grad = ctx.createLinearGradient(baseX - w * 0.12, 0, baseX + w * 0.12, 0);
        grad.addColorStop(0, rgbToStr(color, 0));
        grad.addColorStop(0.5, rgbToStr(color, 0.32 * cfg.glowIntensity * audioBoost));
        grad.addColorStop(1, rgbToStr(color, 0));
        ctx.fillStyle = grad;
        if (profile.glow) { ctx.shadowColor = cfg.glow; ctx.shadowBlur = 20 * cfg.glowIntensity * audioBoost; } else ctx.shadowBlur = 0;

        ctx.beginPath();
        const segments = 8;
        for (let i = 0; i <= segments; i++) {
            const t = i / segments;
            const y = t * h;
            const sway = Math.sin(waveOffset * 1.2 + b * 1.7 + t * 4) * (w * 0.06);
            const x = baseX + sway - w * 0.16;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        for (let i = segments; i >= 0; i--) {
            const t = i / segments;
            const y = t * h;
            const sway = Math.sin(waveOffset * 1.2 + b * 1.7 + t * 4) * (w * 0.06);
            ctx.lineTo(baseX + sway + w * 0.16, y);
        }
        ctx.closePath();
        ctx.fill();
    }
    ctx.shadowBlur = 0;
}

// Νέο, "τεχνολογικό" στυλ (τρίτη παραλλαγή στο Waves mode, δίπλα στο Ribbons/Aurora) — ζητήθηκε
// ρητά ένα νέο, tech-themed κινούμενο φόντο. Πλέγμα κυκλώματος (circuit-board) που κυλάει αργά
// προς τα κάτω, με "παλμούς δεδομένων" που ταξιδεύουν κατά μήκος τυχαίων γραμμών του πλέγματος
// και λαμπερούς κόμβους σε τυχαία σημεία τομής — ίδιο σύστημα χρωμάτων/παλετών με τα άλλα στυλ,
// άρα κληρονομεί αυτόματα όλες τις υπάρχουσες αποχρώσεις (Light/Dark παλέτες).
let techPulses = [];
let techNodes = [];
let techGridOffset = 0;
function ensureTechGrid(w, h, cellSize) {
    const cols = Math.ceil(w / cellSize) + 1;
    const rows = Math.ceil(h / cellSize) + 2;
    if (techNodes.length === cols * rows) return;
    techNodes = [];
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            if (Math.random() < 0.12) techNodes.push({ col: c, row: r, phase: Math.random() * Math.PI * 2 });
        }
    }
    techPulses = Array.from({ length: Math.max(4, Math.floor(cols / 3)) }, () => spawnTechPulse(cols, rows));
}
function spawnTechPulse(cols, rows) {
    const horizontal = Math.random() < 0.5;
    return {
        horizontal,
        line: Math.floor(Math.random() * (horizontal ? rows : cols)),
        t: Math.random(),
        speed: 0.15 + Math.random() * 0.25
    };
}
function drawTechGrid(dtSeconds) {
    const profile = perfProfile();
    const w = window.innerWidth, h = window.innerHeight;
    const cellSize = Math.max(48, Math.min(96, w / 22));
    techGridOffset = (techGridOffset + dtSeconds * 14 * cfg.speed) % cellSize;
    ensureTechGrid(w, h, cellSize);

    const bg = hexToRgb(cfg.background);
    ctx.clearRect(0, 0, w, h);
    const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
    bgGrad.addColorStop(0, rgbToStr(bg, 1));
    bgGrad.addColorStop(1, rgbToStr(mix(bg, hexToRgb(cfg.wave), 0.18), 1));
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, w, h);

    const cols = Math.ceil(w / cellSize) + 1;
    const rows = Math.ceil(h / cellSize) + 2;
    const lineColor = hexToRgba(cfg.wave, 0.35);
    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let c = 0; c <= cols; c++) {
        const x = c * cellSize;
        ctx.moveTo(x, 0); ctx.lineTo(x, h);
    }
    for (let r = 0; r <= rows; r++) {
        const y = r * cellSize - techGridOffset;
        ctx.moveTo(0, y); ctx.lineTo(w, y);
    }
    ctx.stroke();

    // Λαμπεροί κόμβοι σε τυχαία σημεία τομής — απαλό παλλόμενο φως, ίδιο πνεύμα με τα LED
    // ενός πραγματικού κυκλώματος.
    for (const node of techNodes) {
        const x = node.col * cellSize;
        const y = node.row * cellSize - techGridOffset;
        if (y < -cellSize || y > h + cellSize) continue;
        const pulse = 0.4 + 0.6 * Math.abs(Math.sin(node.phase + waveOffset * 1.5));
        ctx.beginPath();
        ctx.arc(x, y, 2.2 * audioBoost, 0, Math.PI * 2);
        ctx.fillStyle = hexToRgba(cfg.peak, 0.5 + pulse * 0.5);
        if (profile.glow) { ctx.shadowColor = cfg.glow; ctx.shadowBlur = 10 * cfg.glowIntensity * pulse; } else ctx.shadowBlur = 0;
        ctx.fill();
    }
    ctx.shadowBlur = 0;

    // "Παλμοί δεδομένων" που ταξιδεύουν κατά μήκος γραμμών του πλέγματος — φωτεινή κουκκίδα με
    // κοντή, ξεθωριασμένη ουρά, ίδια αίσθηση με animated κυκλώματα (π.χ. motherboard traces).
    waveOffset += dtSeconds * 0.3 * cfg.speed;
    for (const p of techPulses) {
        p.t += dtSeconds * p.speed * cfg.speed * audioBoost;
        if (p.t > 1) { p.t = 0; Object.assign(p, spawnTechPulse(cols, rows)); }

        const x = p.horizontal ? p.t * w : p.line * cellSize;
        const y = p.horizontal ? p.line * cellSize - techGridOffset : p.t * h;
        if (y < -cellSize || y > h + cellSize) continue;

        const tailLen = 26;
        const dx = p.horizontal ? 1 : 0, dy = p.horizontal ? 0 : 1;
        const grad = ctx.createLinearGradient(x - dx * tailLen, y - dy * tailLen, x, y);
        grad.addColorStop(0, hexToRgba(cfg.glow, 0));
        grad.addColorStop(1, hexToRgba(cfg.highlight, 0.9));
        ctx.strokeStyle = grad;
        ctx.lineWidth = 2 * cfg.lineThickness;
        ctx.beginPath();
        ctx.moveTo(x - dx * tailLen, y - dy * tailLen);
        ctx.lineTo(x, y);
        if (profile.glow) { ctx.shadowColor = cfg.glow; ctx.shadowBlur = 12 * cfg.glowIntensity; } else ctx.shadowBlur = 0;
        ctx.stroke();
    }
    ctx.shadowBlur = 0;
}

// Εντελώς διαφορετικό, μη-κυματοειδές animated background: αιωρούμενα, λαμπερά σωματίδια
// (bokeh-style) που ανεβαίνουν αργά — επιλογή "Particles" στο Mode.
function ensureParticles(count) {
    if (particles.length === count) return;
    particles = Array.from({ length: count }, () => spawnParticle());
}
function spawnParticle() {
    return {
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: 1 + Math.random() * 2.6,
        speed: 6 + Math.random() * 16,
        drift: (Math.random() - 0.5) * 12,
        phase: Math.random() * Math.PI * 2,
        colorIdx: Math.floor(Math.random() * 3)
    };
}
function drawParticles(dtSeconds) {
    const profile = perfProfile();
    const w = window.innerWidth, h = window.innerHeight;
    ensureParticles(profile.layers * 22);

    const bg = hexToRgb(cfg.background);
    ctx.clearRect(0, 0, w, h);
    const bgGrad = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.max(w, h) * 0.75);
    bgGrad.addColorStop(0, rgbToStr(mix(bg, hexToRgb(cfg.wave), 0.10), 1));
    bgGrad.addColorStop(1, rgbToStr(bg, 1));
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, w, h);

    const palette = [cfg.peak, cfg.glow, cfg.highlight];
    for (const p of particles) {
        p.y -= p.speed * dtSeconds * cfg.speed * audioBoost;
        p.x += Math.sin(p.phase + p.y * 0.01) * p.drift * dtSeconds;
        p.phase += dtSeconds;
        if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
        if (p.x < -10) p.x = w + 10;
        if (p.x > w + 10) p.x = -10;

        const twinkle = 0.5 + 0.5 * Math.sin(p.phase * 2);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * audioBoost, 0, Math.PI * 2);
        ctx.fillStyle = rgbToStr(hexToRgb(palette[p.colorIdx]), 0.35 + twinkle * 0.45);
        if (profile.glow) { ctx.shadowColor = cfg.glow; ctx.shadowBlur = 8 * cfg.glowIntensity * audioBoost; } else ctx.shadowBlur = 0;
        ctx.fill();
    }
    ctx.shadowBlur = 0;
}

let currentVideoUri = null; // το URI που παίζει αυτή τη στιγμή (βλ. playCurrentVideo)
let isPaused = false; // ορίζεται από motionDeskSetPaused — ώστε ένα refresh να μην ξυπνά ένα σκόπιμα παυμένο wallpaper

// "Desktop" mode: the normal Windows wallpaper (image + fit style + background colour from the host), polled once a minute
let deskTimer = null;
function applyDesk(d) {
    const el = document.getElementById('desk');
    if (!el || !d) return;
    // αποδοχή και κεφαλαίων ονομάτων πεδίων (PascalCase) για ασφάλεια
    d = { uri: d.uri ?? d.Uri, style: d.style ?? d.Style, color: d.color ?? d.Color };
    el.style.backgroundColor = d.color || '#101418';
    el.style.backgroundImage = d.uri ? `url("${d.uri}")` : 'none';
    const st = d.style || 'Fill';
    el.style.backgroundSize = st === 'Fit' ? 'contain' : st === 'Stretch' ? '100% 100%' : st === 'Center' || st === 'Tile' ? 'auto' : 'cover';
    el.style.backgroundRepeat = st === 'Tile' ? 'repeat' : 'no-repeat';
    el.style.backgroundPosition = 'center';
}
function setDeskVisible(v) { const el = document.getElementById('desk'); if (el) el.style.display = v ? 'block' : 'none'; }
async function refreshDesk() {
    const b = bridge();
    if (!b) return;
    try { applyDesk(JSON.parse(await b.GetDesktopWallpaperJson())); } catch (e) { /* κρατάει την προηγούμενη εικόνα */ }
}
async function startDesktop() {
    stopWaves();
    hideMedia();
    videoLayers.forEach(v => { v.classList.add('videoHidden'); v.classList.remove('active'); v.pause(); });
    applyDesk(cfg.desk);
    // ΔΙΟΡΘΩΣΗ πραγματικού flicker στην εκκίνηση (live-επιβεβαιωμένο με διαδοχικά screenshots): το
    // setDeskVisible(true) ΓΙΝΟΤΑΝ πριν περιμένουμε την εικόνα, οπότε το στοιχείο ήταν ήδη ορατό
    // (display:block) με μόνο το φόντο χρώμα (σκούρο navy) πριν προλάβει να ζωγραφιστεί η φωτογραφία
    // — ακριβώς το "όλη η επιφάνεια εργασίας μαυρίζει στιγμιαία" που αναφέρθηκε. Τώρα μένει κρυφό
    // μέχρι να είναι έτοιμη η εικόνα. Επίσης το παλιό onload εγγυάται μόνο ότι κατέβηκαν τα bytes,
    // ΟΧΙ πλήρη αποκωδικοποίηση — σε μεγάλες φωτογραφίες ο browser μπορεί να κάνει decode ασύγχρονα
    // μετά το onload· το decode() εγγυάται ότι η εικόνα είναι έτοιμη να ζωγραφιστεί αμέσως.
    const uri = cfg.desk && (cfg.desk.uri ?? cfg.desk.Uri);
    if (uri) {
        const img = new Image();
        img.src = uri;
        const ready = (typeof img.decode === 'function')
            ? img.decode().catch(() => new Promise(res => { img.onload = img.onerror = res; }))
            : new Promise(res => { img.onload = img.onerror = res; });
        await Promise.race([ready, new Promise(res => setTimeout(res, 1500))]);
    }
    setDeskVisible(true);
    // img.decode() εγγυάται ότι το ΙΔΙΟ Image αντικείμενο είναι αποκωδικοποιημένο, όχι ότι ο
    // compositor έχει ήδη ζωγραφίσει το background-image ενός ΔΙΑΦΟΡΕΤΙΚΟΥ στοιχείου (#desk) που
    // δείχνει στο ίδιο URI — ένα μικρό residual flash παρέμενε ζωντανά ακόμα και μετά το decode().
    // Δύο rAF εγγυώνται ότι έχει προλάβει να τρέξει τουλάχιστον ένα πραγματικό paint πριν συνεχίσουμε
    // (και άρα πριν σηματοδοτηθεί signalReady() στον καλούντα, βλ. doRefresh/prepareFirstFrame).
    await new Promise(res => requestAnimationFrame(() => requestAnimationFrame(res)));
}

function drawWeather(dt) {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    try { WeatherWallpaper.draw(ctx, dt, { id: cfg.performanceMode }); } finally { ctx.restore(); }
}

// Ο καιρός έρχεται από τη C# πλευρά (cache 10 λεπτών, fallback σε 2ο πάροχο) — το JS δεν κάνει δικτυακές κλήσεις.
let infoTimer = null;
// Ώρα / ημερομηνία / θερμοκρασία στην οθόνη (μόνο στο Weather mode). Η ώρα είναι αυτή του σκηνικού (τοποθεσία ή προσομοίωση).
function updateWeatherInfo() {
    const box = document.getElementById('wxInfo');
    if (!box) return;
    if (!cfg.weatherInfo || !window.WeatherWallpaper) { box.style.display = 'none'; return; }   // το cfg.weatherInfo ισχύει ήδη ανά mode (βλ. C#)
    const i = WeatherWallpaper.info();
    // 1.7.8: 14 γλώσσες (ίδιες με το GearWin) - το cfg.lang είναι ο κωδικός της εφαρμογής (el/en/de/fr/...).
    const LOCALES = { el: 'el-GR', en: 'en-US', de: 'de-DE', fr: 'fr-FR', es: 'es-ES', ko: 'ko-KR', zh: 'zh-CN', it: 'it-IT',
                      ru: 'ru-RU', ja: 'ja-JP', pt: 'pt-PT', tr: 'tr-TR', ar: 'ar-SA', hi: 'hi-IN' };
    const lang = LOCALES[cfg.lang] || 'en-US';
    document.documentElement.lang = LOCALES[cfg.lang] ? cfg.lang : 'en';   // σωστά κεφαλαία στα ελληνικά (χωρίς τόνους) στο text-transform
    const t = new Date(2000, 0, 1, i.h, i.m);
    document.getElementById('wxTime').textContent = t.toLocaleTimeString(lang, { hour: '2-digit', minute: '2-digit', hour12: cfg.lang === 'el' ? false : undefined });
    document.getElementById('wxDate').textContent = i.date.toLocaleDateString(lang, { weekday: 'long', day: 'numeric', month: 'long' });
    const condId = ({ 0: 'Clear', 1: 'PartlyCloudy', 2: 'PartlyCloudy', 3: 'Cloudy', 45: 'Fog', 48: 'Fog', 51: 'Drizzle', 53: 'Drizzle', 55: 'Drizzle', 56: 'Drizzle', 57: 'Drizzle',
        61: 'Rain', 63: 'Rain', 66: 'Rain', 67: 'Rain', 80: 'Rain', 81: 'Rain', 65: 'HeavyRain', 82: 'HeavyRain', 71: 'Snow', 73: 'Snow', 75: 'Snow', 77: 'Snow', 85: 'Snow', 86: 'Snow',
        95: 'Thunderstorm', 96: 'Thunderstorm', 99: 'Thunderstorm' })[i.code];
    const cond = (cfg.condLabels && condId && cfg.condLabels[condId]) || '';
    // Ζητήθηκε ρητά "η θερμοκρασία να είναι με 1 δεκαδικό" (ήταν Math.round, π.χ. "18°C" -> "18.3°C").
    let tempText = '';
    if (typeof i.temp === 'number') {
        const v = cfg.fahrenheit ? i.temp * 9 / 5 + 32 : i.temp;
        tempText = v.toFixed(1) + (cfg.fahrenheit ? '°F' : '°C');
    }
    // Ζητήθηκε ρητά "ο άνεμος δίπλα από τη θερμοκρασία" — πριν ήταν σε δική του ξεχωριστή γραμμή
    // (#wxWind) κάτω από τη θερμοκρασία· τώρα ενώνεται στην ΙΔΙΑ γραμμή με το ίδιο "·" διαχωριστικό
    // που ήδη ενώνει θερμοκρασία+συνθήκη. Το #wxWind element μένει στο DOM (θέση/CSS ανέγγιχτη) αλλά
    // άδειο — κρύβεται μέσω CSS (:empty) ώστε να μη μείνει κενό διάστημα.
    const windText = typeof i.windKmh === 'number' ? `${i.windKmh} km/h` : '';
    document.getElementById('wxTemp').textContent = [tempText, windText, cond].filter(Boolean).join('  ·  ');
    document.getElementById('wxWind').textContent = '';
    document.getElementById('wxCity').textContent = cfg.weatherCity || '';
    box.style.fontFamily = '"' + String(cfg.infoFont || 'Segoe UI Light').replace(/["\\]/g, '') + '", "Segoe UI", system-ui, sans-serif';
    box.style.left = (cfg.infoX ?? 50) + '%';
    box.style.top = (cfg.infoY ?? 34) + '%';
    box.style.setProperty('--s', ((cfg.infoScale ?? 100) / 100).toFixed(2));
    box.style.display = 'block';
    // fade in once the temperature is known (or after 3.5 s without data) — no half-empty block that jumps when the data arrives
    box.style.opacity = (typeof i.temp === 'number' || performance.now() > 3500) ? '1' : '0';
}

let weatherTimer = null;
let rotationTimer = null; // εναλλαγή βίντεο ανά N λεπτά (Video mode)
let weatherPollHandles = [];
async function pollWeatherOnce() {
    const b = bridge();
    if (!b || !window.WeatherWallpaper) return false;
    try {
        const data = JSON.parse(await b.GetWeatherJson());
        WeatherWallpaper.setWeather(data);
        updateWeatherInfo();
        return data.ok === true;
    } catch (e) { return false; }   // κρατάει τα προηγούμενα δεδομένα
}
// Το host object δεν επιστρέφει Task: ζητάμε ανανέωση (επιστρέφει αμέσως) και διαβάζουμε την cache μετά από λίγο — με επαναλήψεις αν δεν έχει έρθει ακόμα.
async function refreshWeather() {
    const b = bridge();
    if (!b || !window.WeatherWallpaper) return;
    weatherPollHandles.forEach(clearTimeout);
    weatherPollHandles = [];
    try { b.RequestWeatherRefresh(); } catch (e) { /* ignore */ }
    if (await pollWeatherOnce()) {
        // ίσως η cache ήταν παλιά και ανανεώνεται τώρα: μία ακόμα ανάγνωση σε λίγα δευτερόλεπτα
        weatherPollHandles.push(setTimeout(pollWeatherOnce, 6000));
        return;
    }
    [1500, 4000, 10000, 30000, 90000].forEach(ms => weatherPollHandles.push(setTimeout(pollWeatherOnce, ms)));
}

function renderFrame(dt) {
    if (cfg.mode === 'Weather') drawWeather(dt);
    else if (cfg.mode === 'Particles') drawParticles(dt);
    else if (cfg.waveStyle === 'Aurora') drawAurora(dt);
    else if (cfg.waveStyle === 'TechGrid') drawTechGrid(dt);
    else drawWaves(dt);
}

function waveLoop(now) {
    const profile = perfProfile();
    const minFrameMs = 1000 / profile.targetFps;

    if (now - lastFrameTime >= minFrameMs) {
        const dt = Math.min(0.1, (now - lastFrameTime) / 1000 || 0.016);
        renderFrame(dt);
        lastFrameTime = now;
    }
    waveLoopHandle = requestAnimationFrame(waveLoop);
}

function startWaves() {
    hideMedia();
    setDeskVisible(false);
    videoLayers.forEach(v => { v.classList.add('videoHidden'); v.classList.remove('active'); v.pause(); });
    canvas.style.display = 'block';
    if (!waveLoopHandle && !isPaused) waveLoopHandle = requestAnimationFrame(waveLoop);
}

function stopWaves() {
    if (waveLoopHandle) { cancelAnimationFrame(waveLoopHandle); waveLoopHandle = null; }
    canvas.style.display = 'none';
}

// "Image" (GIF/PNG/JPG) and "Page" (website / YouTube / local html) modes. While paused nothing is loaded: the source is dropped and re-applied on resume.
const mediaImg = document.getElementById('mediaImg');
const mediaFrame = document.getElementById('mediaFrame');
let mediaSrc = '';
function hideMedia() {
    mediaImg.style.display = 'none'; mediaImg.removeAttribute('src');
    mediaFrame.style.display = 'none'; mediaFrame.removeAttribute('src');
    mediaSrc = '';
}
async function startMedia() {
    stopWaves();
    setDeskVisible(false);
    videoLayers.forEach(v => { v.classList.add('videoHidden'); v.classList.remove('active'); v.pause(); });
    const isImg = cfg.mode === 'Image';
    const src = isImg ? cfg.imageUri : cfg.pageUri;
    if (!src) { startWaves(); return; }
    if (isPaused) { hideMedia(); return; }
    if (isImg) {
        mediaFrame.style.display = 'none'; mediaFrame.removeAttribute('src');
        mediaImg.style.objectFit = cfg.imageFit === 'Contain' ? 'contain' : 'cover';
        if (mediaSrc !== src) { mediaImg.src = src; mediaSrc = src; try { await mediaImg.decode(); } catch (e) { /* shown anyway */ } }
        mediaImg.style.display = 'block';
    } else {
        mediaImg.style.display = 'none'; mediaImg.removeAttribute('src');
        if (mediaSrc !== src) { mediaFrame.src = src; mediaSrc = src; }
        mediaFrame.style.display = 'block';
    }
}

// ---- API for local web wallpapers: the page in the frame talks to Opsis only through window messages ----
function postToFrame(msg) { try { if (mediaFrame.contentWindow) mediaFrame.contentWindow.postMessage(msg, '*'); } catch (e) { /* frame gone */ } }
window.opsisPush = postToFrame;
window.opsisSendProps = async () => {
    const b = bridge();
    if (!b || !cfg.pageLocal) return;
    try { postToFrame({ opsis: true, type: 'props', props: JSON.parse(await b.GetPagePropertiesJson()) }); } catch (e) { /* ignore */ }
};
mediaFrame.addEventListener('load', () => {
    if (!cfg.pageLocal) return;
    postToFrame({ opsis: true, type: 'hello', version: 1 });
    window.opsisSendProps();
});
window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.opsis !== 'subscribe' || e.source !== mediaFrame.contentWindow || !cfg.pageLocal) return;
    try { const b = bridge(); if (b) b.SetSubscription(!!d.audio, !!d.gpu, !!d.pointer); } catch (x) { /* ignore */ }
});

async function playCurrentVideo() {
    const b = bridge();
    if (!b) return;
    const uri = await b.GetCurrentVideoUri();
    if (!uri) { startWaves(); return; }

    stopWaves();
    hideMedia();
    setDeskVisible(false);
    videoLayers.forEach(v => v.classList.remove('videoHidden'));
    const layer = activeVideo();
    // Ένα refresh (αλλαγή ρύθμισης: ήχος/απόδοση/παλέτα…) ΔΕΝ πρέπει να ξαναρχίζει το ίδιο βίντεο από την
    // αρχή — αν παίζει ήδη αυτό το URI, απλώς το αφήνουμε να συνεχίσει.
    if (currentVideoUri === uri && layer.src && !layer.ended) {
        layer.classList.add('active');
        if (!isPaused && layer.paused) layer.play().catch(() => {});
        return;
    }
    currentVideoUri = uri;
    layer.src = uri;
    layer.classList.add('active');
    if (isPaused) return;
    try { await layer.play(); } catch (e) { advanceVideo(); }
}

// Φορτώνει το επόμενο βίντεο στο ΚΡΥΦΟ layer και κάνει crossfade μόλις είναι έτοιμο να παίξει
// — αντί να κόβει απότομα το προηγούμενο (παλιά συμπεριφορά: ένα .src swap σε ΕΝΑ video, με
// αναπόφευκτο ένα κενό/μαύρο frame ανάμεσα).
function crossfadeTo(uri) {
    const incoming = nextVideo();
    const outgoing = activeVideo();
    incoming.classList.remove('videoHidden');

    let started = false;
    let safetyTimer = null;
    const startPlayback = () => {
        if (started) return;
        started = true;
        if (safetyTimer) clearTimeout(safetyTimer);
        if (!isPaused) incoming.play().catch(() => advanceVideo());
        incoming.classList.add('active');
        outgoing.classList.remove('active');
        activeLayerIdx = 1 - activeLayerIdx;
        // Το παλιό βίντεο σταματάει μόνο ΑΦΟΥ ολοκληρωθεί το CSS fade (650ms), ώστε να μην κοπεί
        // απότομα ενώ είναι ακόμα ημι-ορατό στη μετάβαση.
        setTimeout(() => { outgoing.pause(); }, 700);
    };

    // ΔΙΟΡΘΩΣΗ πραγματικού bug ("δεν αναπαράγονται το ένα μετά το άλλο" — η playlist κολλούσε
    // μετά την πρώτη μετάβαση): το readyState ΑΜΕΣΩΣ μετά την ανάθεση .src μπορεί ΑΚΟΜΑ να
    // αντανακλά το ΠΡΟΗΓΟΥΜΕΝΟ βίντεο αυτού του (επαναχρησιμοποιούμενου) layer — η αλλαγή .src
    // δεν μηδενίζει συγχρονισμένα το readyState, οπότε ο παλιός έλεγχος `readyState >= 2`
    // μπορούσε να περάσει λανθασμένα ΠΡΙΝ φορτωθεί πραγματικά το νέο βίντεο, αφήνοντας τη
    // μετάβαση σε ημιτελή κατάσταση. Τώρα περιμένουμε ΠΑΝΤΑ ένα φρέσκο 'canplay' μετά από ρητό
    // .load(), ΚΑΙ προσθέσαμε ένα safety-timeout (5s) — αν ένα βίντεο αποτύχει να φορτώσει για
    // οποιονδήποτε λόγο, η playlist προχωράει στο επόμενο αντί να κολλήσει για πάντα.
    incoming.addEventListener('canplay', startPlayback, { once: true });
    safetyTimer = setTimeout(startPlayback, 5000);
    currentVideoUri = uri;
    incoming.src = uri;
    incoming.load();
}

async function advanceVideo() {
    const b = bridge();
    if (!b) return;
    const uri = await b.AdvanceVideo();
    if (!uri) { startWaves(); return; }
    // Ίδιο αρχείο (μοναδικό βίντεο ή "παίξε κάθε βίντεο N φορές"): επανεκκίνηση επί τόπου, χωρίς crossfade/reload
    if (uri === currentVideoUri && activeVideo().src) {
        const v = activeVideo();
        v.currentTime = 0;
        if (!isPaused) v.play().catch(() => {});
        return;
    }
    crossfadeTo(uri);
}

videoLayers.forEach(v => {
    v.addEventListener('ended', () => { if (v === activeVideo()) advanceVideo(); });
    v.addEventListener('error', () => { if (v === activeVideo()) advanceVideo(); });
});

async function refreshAudioPulse() {
    const b = bridge();
    if (!b) return;
    try {
        const peak = await b.GetAudioPeak();
        const scale = cfg.performanceMode === 'High' ? 1.6 : (cfg.performanceMode === 'Balanced' ? 1.0 : 0.5);
        pulse.style.opacity = Math.min(0.6, peak * scale).toFixed(2);
        // Ομαλή (attack γρήγορο, release αργό) διόγκωση του ίδιου του κύματος/particles/aurora —
        // όχι μόνο το ξεχωριστό radial glow overlay από πάνω. target 1.0 = ησυχία, έως ~1.6 στα
        // δυνατά σημεία του ήχου.
        const target = 1 + Math.min(0.6, peak * scale);
        audioBoost = target > audioBoost ? target : audioBoost * 0.90 + target * 0.10;
    } catch (e) { /* ignore */ }
}

let readySent = false;
function signalReady() {
    if (readySent) return;
    readySent = true;
    try { bridge()?.NotifyReady(); } catch (e) { /* ignore */ }
}
// The window is still hidden while it starts, and a hidden WebView does not fire animation frames — so the first frame of the canvas modes is
// drawn explicitly here (the page is then already painted when the window is revealed) and the signal is sent from a timer, not from rAF.
async function prepareFirstFrame() {
    if (['Waves', 'Particles', 'Weather'].includes(cfg.mode)) { try { renderFrame(0.016); } catch (e) { /* ignore */ } }
    await new Promise(res => setTimeout(res, 80));
}

// Refreshes are queued: overlapping runs (several settings changes in a row) interleaved their steps and made the scene flicker
let refreshChain = Promise.resolve();
window.motionDeskRefresh = () => (refreshChain = refreshChain.then(doRefresh).catch(() => {}));

async function doRefresh() {
    const b = bridge();
    if (!b) return;

    try { cfg = JSON.parse(await b.GetWaveConfigJson()); } catch (e) { /* keep previous cfg */ }

    if (window.WeatherWallpaper) {
        const wx = cfg.mode === 'Weather';   // οι προσομοιώσεις (καιρός/ώρα/άνεμος) ισχύουν μόνο στο Weather mode — τα υπόλοιπα modes δείχνουν την πραγματική ώρα/θερμοκρασία
        WeatherWallpaper.setConfig({ weatherSim: wx ? (cfg.weatherSim || 'Auto') : 'Auto', timeSim: wx ? (cfg.timeSim || 'Auto') : 'Auto', windSim: wx ? (cfg.windSim || 'Auto') : 'Auto', glass: cfg.weatherGlass !== false, lat: cfg.weatherLat, lon: cfg.weatherLon });
    }
    clearTimeout(rotationTimer); clearInterval(rotationTimer);
    rotationTimer = null;
    if (cfg.mode === 'Video' && cfg.rotateMinutes > 0) {
        // the first switch is counted from the LAST real switch (kept in the settings), so refreshes and restarts do not postpone it
        const every = cfg.rotateMinutes * 60 * 1000;
        const tick = () => { if (!isPaused) advanceVideo(); rotationTimer = setTimeout(tick, every); };
        rotationTimer = setTimeout(tick, Math.max(15000, cfg.rotateFirstMs || every));
    }

    clearInterval(infoTimer);
    infoTimer = null;
    updateWeatherInfo();
    if (cfg.weatherInfo) infoTimer = setInterval(updateWeatherInfo, 1000);

    clearInterval(weatherTimer);
    weatherTimer = null;
    if (cfg.mode === 'Weather' || cfg.weatherInfo) {
        // ΔΙΟΡΘΩΣΗ "flickering στην εκκίνηση του weather wallpaper": το refreshWeather() ΔΕΝ
        // περιμενόταν πριν το prepareFirstFrame()/signalReady() παρακάτω — το ΠΡΩΤΟ frame που
        // "φωτογραφιζόταν" πριν αποκαλυφθεί το παράθυρο ζωγραφιζόταν με προεπιλεγμένο καιρό
        // (καθαρός ουρανός, άπνοια — βλ. WeatherWallpaper computeTargets όταν data==null), και
        // μόλις έφτανε ο πραγματικός καιρός λίγο αργότερα το σκηνικό "μεταπηδούσε" ορατά στη
        // σωστή κατάσταση — ακριβώς αυτό που αναφέρθηκε ως flicker, διαλείπον γιατί εξαρτιόταν
        // από το αν η cache ήταν ήδη ζεστή τη συγκεκριμένη στιγμή. Περιμένουμε ΤΗΝ ΠΡΩΤΗ
        // προσπάθεια του refreshWeather() (συνήθως στιγμιαία αν η cache είναι ήδη ζεστή — βλ.
        // pollWeatherOnce) με ανώτατο όριο 400ms ώστε να ΜΗΝ επανέλθει το παλιότερο πρόβλημα
        // "το παράθυρο καθυστερεί να εμφανιστεί περιμένοντας δίκτυο" — αν δεν προλάβει, η σκηνή
        // απλώς μεταβαίνει ομαλά στη σωστή κατάσταση όπως πριν, όχι χειρότερα από ό,τι ήταν.
        await Promise.race([refreshWeather(), new Promise(res => setTimeout(res, 400))]);
        weatherTimer = setInterval(refreshWeather, 10 * 60 * 1000);
    }

    clearInterval(audioTimer);
    audioTimer = (cfg.performanceMode === 'Battery' || isPaused) ? null : setInterval(refreshAudioPulse, cfg.performanceMode === 'High' ? 250 : 600);

    clearInterval(deskTimer);
    deskTimer = null;
    if (cfg.mode === 'Video') {
        await playCurrentVideo();
    } else if (cfg.mode === 'Image' || cfg.mode === 'Page') {
        await startMedia();
    } else if (cfg.mode === 'Application') {
        // the program's own window covers the page: nothing to draw here
        stopWaves(); hideMedia(); setDeskVisible(false);
        videoLayers.forEach(v => { v.classList.add('videoHidden'); v.classList.remove('active'); v.pause(); });
    } else if (cfg.mode === 'Desktop') {
        await startDesktop();
        deskTimer = setInterval(refreshDesk, 60 * 1000);
    } else {
        startWaves();
    }
    if (window.opsisApplyElements) window.opsisApplyElements();
    if (!readySent) { await prepareFirstFrame(); signalReady(); }
};

// Αυτόματη παύση σε fullscreen εφαρμογές/παιχνίδια (καλείται από τη C# πλευρά) — καθαρή
// εξοικονόμηση CPU/GPU αφού το wallpaper δεν είναι ορατό πίσω από ένα fullscreen παράθυρο.
window.motionDeskSetPaused = (paused) => {
    isPaused = !!paused;
    if (window.opsisPauseElements) window.opsisPauseElements(isPaused);
    if (paused) {
        if (waveLoopHandle) { cancelAnimationFrame(waveLoopHandle); waveLoopHandle = null; }
        activeVideo().pause();
        if (cfg.mode === 'Image' || cfg.mode === 'Page') hideMedia();
        clearInterval(audioTimer);
        audioTimer = null;
    } else {
        if (cfg.mode === 'Video') { activeVideo().play().catch(() => {}); }
        else if (cfg.mode === 'Image' || cfg.mode === 'Page') { startMedia(); }
        else if (cfg.mode === 'Desktop') { /* static picture, nothing to restart */ }
        else if (!waveLoopHandle) { waveLoopHandle = requestAnimationFrame(waveLoop); }
        if (!audioTimer && cfg.performanceMode !== 'Battery') audioTimer = setInterval(refreshAudioPulse, cfg.performanceMode === 'High' ? 250 : 600);
    }
};

window.motionDeskRefresh();
</script>
</body>
</html>
